syntax = "proto3";

package org.nightfury.proto.common.helloworld.v1;
option java_multiple_files = true;
option java_package = "org.nightfury.proto.common.helloworld.v1";
option java_outer_classname = "HelloWorldPayloadProto";

message HelloWorldRequest {
  string name = 1;
}

message HelloWorldResponse {
  string message = 1;
}