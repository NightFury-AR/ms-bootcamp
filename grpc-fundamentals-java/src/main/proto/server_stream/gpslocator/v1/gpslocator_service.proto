syntax = "proto3";

package org.nightfury.proto.server_stream.gpslocator.v1;
option java_multiple_files = true;
option java_outer_classname = "GPSLocatorServiceProto";

import "server_stream/gpslocator/v1/gpslocator_payload.proto";

service GPSLocatorService {
  // Server streaming RPC to get the location of a vehicle
  rpc GetVehicleLocation(LocationRequest) returns (stream LocationResponse);
}

// The GetVehicleLocation method takes a LocationRequest and returns a stream of LocationResponse messages.
// This allows the server to send multiple location updates for a vehicle over time.
// The client can read from the stream to receive these updates as they become available.
// This is useful for applications that need real-time location tracking, such as GPS navigation systems or fleet management software.
// The LocationRequest message contains the vehicle ID and name, while the LocationResponse message contains the vehicle name, latitude, and longitude.
// The server can send multiple LocationResponse messages for a single LocationRequest, allowing the client to receive continuous updates on the vehicle's location.
// The stream is closed when the server has no more updates to send, or it can be closed by the client if it no longer needs updates.
// This pattern is commonly used in applications that require real-time data updates, such as live tracking systems or monitoring applications.
// The server can implement logic to determine when to send updates, such as based on time intervals or changes in the vehicle's location.
// The client can handle the stream asynchronously, allowing it to process updates as they arrive without blocking.
// This approach is efficient for scenarios where the server needs to push updates to the client without requiring the client to repeatedly request new data.
// The use of server streaming RPCs in gRPC allows for efficient communication between the server and client, especially in scenarios where continuous updates are needed.
