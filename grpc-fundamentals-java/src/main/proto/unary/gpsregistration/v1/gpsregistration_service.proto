syntax = "proto3";

package org.nightfury.proto.unary.gpsregistration.v1;

option java_multiple_files = true;
option java_outer_classname = "GPSRegistrationServiceProto";

import "unary/gpsregistration/v1/gpsregistration_payload.proto";

service GPSRegistrationService {
  rpc RegisterVehicle (VehicleRegistrationRequest) returns (VehicleRegistrationResponse);
}