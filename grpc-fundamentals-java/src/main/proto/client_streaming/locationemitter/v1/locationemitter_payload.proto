syntax = "proto3";

package org.nightfury.proto.client_streaming.locationemitter.v1;

option java_multiple_files = true;
option java_outer_classname = "LocationEmitterPayloadProto";

message CurrentLocationData {
  int32 vehicleId = 1;
  string vehicleName = 2;
  double latitude = 3;
  double longitude = 4;
}

message VehicleLocationData {
  string vehicleName = 1;
  double latitude = 2;
  double longitude = 3;
}

message ServerResponse {
  repeated VehicleLocationData receivedCoOrds = 1;
  string status = 4; // e.g., "Location received", "Error: Invalid coordinates"
}
