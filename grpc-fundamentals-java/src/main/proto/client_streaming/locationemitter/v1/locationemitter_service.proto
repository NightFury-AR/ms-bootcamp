syntax = "proto3";

package org.nightfury.proto.client_streaming.locationemitter.v1;
option java_multiple_files = true;
option java_outer_classname = "LocationEmitterServiceProto";

import "client_streaming/locationemitter/v1/locationemitter_payload.proto";

service LocationEmitterService {
  // Client streaming RPC to send vehicle location updates
  rpc SendVehicleLocation(stream CurrentLocationData) returns (ServerResponse);
}